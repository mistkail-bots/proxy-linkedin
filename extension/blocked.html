<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LinkedIn blocked</title>
<style>
  :root { --bg:#f4f6f9; --card:#fff; --text:#172033; --muted:#66728a; --bad:#c53030; --ok:#1a8f4c; --line:#e3e8ef; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0e131b; --card:#171e29; --text:#e8edf5; --muted:#8b97ab; --bad:#f07a7a; --ok:#4cc77e; --line:#263041; } }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--text); font:15px/1.5 system-ui,sans-serif; }
  .card { max-width:440px; margin:20px; padding:32px; background:var(--card); border:1px solid var(--line); border-radius:14px; text-align:center; }
  .icon { width:56px; height:56px; border-radius:50%; background:var(--bad); color:#fff; display:grid; place-items:center; font-size:30px; font-weight:700; margin:0 auto 14px; }
  h1 { font-size:20px; margin:0 0 6px; } p { color:var(--muted); margin:6px 0; }
  #reason { color:var(--bad); font-weight:600; }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">!</div>
    <h1>LinkedIn is blocked</h1>
    <p>The proxy server isn't reachable, so LinkedIn was stopped to keep it from connecting directly from this location.</p>
    <p id="reason">Checking…</p>
    <p>This page reloads LinkedIn automatically as soon as the proxy is back.</p>
  </div>
  <script src="blocked.js"></script>
</body>
</html>
